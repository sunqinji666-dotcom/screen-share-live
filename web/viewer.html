<script>
'use strict';
const qs = new URLSearchParams(location.search);
const room = qs.get('r');
const FAKE = qs.has('fake');
const AUTOSTART = qs.has('autostart');
const RELAY = qs.has('relay'); // 测试模式：强制只走 TURN 中继

const $ = (id) => document.getElementById(id);
const video = $('video');

let ws = null, pc = null;
// 信令串行化：offer 必须按序处理。上一个 answer 没发完又来新 offer（开摄像头重协商 / 提速重打洞 / ICE restart 撞车）
// 会让 setRemoteDescription 抛错且被静默吞掉 → 整条链路卡死。所有 offer 进队列串行处理。
let offerChain = Promise.resolve();
// ICE 候选缓冲：setRemoteDescription 完成前到达的候选直接 addIceCandidate 会被浏览器拒掉并丢失
// （最先到的往往是直连最优路径）→ 接通慢、打洞成功率低、更容易掉到中继。先缓冲，线路就绪后再补。
let pendingCandidates = [];
let micTrack = null;
let camStream = null, camTrack = null, camOn = false, camFacing = 'user', camSender = null;
let screenSet = false, hostCamOn = true; // 顺序法：第一条 video m-line=屏幕，第二条=主播摄像头
let screenRecvTrack = null, connectedAt = 0, firstFrameRestarted = false; // 首帧自愈用
let iceServers = [{ urls: ['stun:stun.qq.com:3478', 'stun:stun.miwifi.com:3478'] }];
let selfMuted = false;
let mutedByHost = false; // 主播端把我静音时锁定本地麦克风

$('ver').textContent = document.documentElement.dataset.build || '';

// ---------- 状态展示 ----------
function setTop(state, text) {
  $('dot').className = 'dot ' + state;
  $('topStatus').textContent = text;
}
function setStatus(s) { setTop(pc && pc.connectionState === 'connected' ? 'on' : 'wait', s); }
function setTitle(s) { document.title = s; }

// 点击画面唤出/隐藏界面（10 秒无操作自动隐藏，保沉浸感）
let uiTimer = null;
function wakeUI(auto) {
  document.body.classList.remove('ui-hidden');
  clearTimeout(uiTimer);
  if (video.srcObject) uiTimer = setTimeout(() => document.body.classList.add('ui-hidden'), 10000);
}
video.addEventListener('click', () => wakeUI(false));
// 自动播放兜底：任意触摸后补播画面与主播声音（观众端零音量控件，音量交给手机音量键）
['touchend', 'click'].forEach((ev) => document.addEventListener(ev, () => {
  if (video.paused && video.srcObject) video.play().catch(() => {});
  document.querySelectorAll('audio[id^="hostAudio"]').forEach((a) => {
    if (a.paused) a.play().catch(() => {});
  });
}, { passive: true }));
// 首帧看门狗：线路已通但画面卡着不放 → 3 秒一补播；
// 接通 6 秒仍收不到任何画面帧（轨一直静默）→ 自动重协商一次，等效自动「重进一次」
setInterval(() => {
  if (!pc || pc.connectionState !== 'connected') return;
  if (video.srcObject && video.paused) video.play().catch(() => {});
  document.querySelectorAll('audio[id^="hostAudio"]').forEach((a) => {
    if (a.paused) a.play().catch(() => {});
  });
  if (screenSet && video.videoWidth === 0 && !firstFrameRestarted && connectedAt && Date.now() - connectedAt > 6000) {
    firstFrameRestarted = true;
    requestRestart('画面未能建立，正在自动重新协商…');
  }
}, 3000);

if (!room) {
  $('joinScreen').innerHTML = '<h2>链接不完整</h2><p>请让对方重新发送链接。</p>';
}

async function join() {
  if (!room) return;
  try {
    if (!FAKE) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('unsupported');
      setStatus('申请麦克风…');
      const mic = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
      micTrack = mic.getAudioTracks()[0];
    } else {
      const ac = new AudioContext();
      if (ac.state === 'suspended') await ac.resume();
      const osc = ac.createOscillator();
      osc.frequency.value = 660;
      const dst = ac.createMediaStreamDestination();
      osc.connect(dst);
      osc.start();
      micTrack = dst.stream.getAudioTracks()[0];
    }

    setStatus('连接中…');
    const name = ($('nameInput').value || '').trim().slice(0, 12);
    if (name) localStorage.setItem('ssl_dname', name);
    ws = connectWS();
    $('joinScreen').style.display = 'none';
    wakeUI();
  } catch (err) {
    console.error(err);
    setTitle('V:err:' + (err.name || err.message));
    $('joinScreen').innerHTML = '<h2>无法加入</h2><p>' + (
      err.name === 'NotAllowedError'
        ? '没有拿到麦克风权限。请在微信右上角菜单里选「用浏览器打开」再试，或检查麦克风权限。'
        : '当前环境不支持实时通话，请在微信右上角菜单里选「用浏览器打开」试试。'
    ) + '</p>';
  }
}

// 子路径部署时 WS 路径跟着页面 URL 走（如 /live/ws）
function basePath() { return location.pathname.replace(/\/[^/]*$/, ''); }

// ---------- 信令连接（含断线自动重连：网络切换后整体重建会话） ----------
let intentionalClose = false; // 自己点挂断时不走自动重连
let wsAttempts = 0;
const MAX_WS_ATTEMPTS = 40;   // 约 2 分钟，超出才放弃并显示手动重试

function connectWS() {
  const socket = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + basePath() + '/ws');
  socket.onopen = () => {
    wsAttempts = 0;
    socket.send(JSON.stringify({
      t: 'view-join', room,
      name: localStorage.getItem('ssl_dname') || '',
      desc: devDesc,
      did: deviceId(),
    }));
  };
  socket.onmessage = (ev) => { try { onMsg(JSON.parse(ev.data)); } catch (_) {} };
  socket.onclose = () => {
    if (intentionalClose || !room) return;
    ws = null;
    resetPC(); // 只清 PC，保留麦克风（重连后复用，不重新要权限）
    setTop('wait', '网络切换，自动重连中…');
    setStatus('自动重连中…');
    setTitle('V:reconnect');
    scheduleReconnect();
  };
  return socket;
}

function scheduleReconnect() {
  wsAttempts++;
  if (wsAttempts > MAX_WS_ATTEMPTS) {
    $('joinScreen').style.display = 'flex';
    $('joinScreen').innerHTML = '<h2>连接中断</h2><p>自动重连未成功（网络可能不稳定）。<br>请检查网络后重试。</p>' +
      '<button id="retryBtn" style="font-size:16px;padding:12px 36px">重新连接</button>';
    document.getElementById('retryBtn').onclick = () => location.reload();
    setTop('off', '连接中断');
    return;
  }
  const delay = Math.min(5000, 800 * wsAttempts);
  setTimeout(() => {
    if (ws || intentionalClose) return;
    try {
      ws = connectWS();
    } catch (_) { scheduleReconnect(); }
  }, delay);
}

// 设备描述：观众没填称呼时就用它当名字，尽量具体到机型
// iPhone 的 UA 不带型号 → 按屏幕逻辑尺寸+像素密度推算机型档位；
// 安卓新版 Chrome 把 UA 里的型号精简成「K」→ 先用 Client Hints 取真实型号，再按厂商型号编码补品牌
const IPHONE_BY_SCREEN = {
  '320x568@2': 'iPhone SE 一代', '375x667@2': 'iPhone 6s~8/SE', '414x736@3': 'iPhone 8 Plus',
  '375x812@3': 'iPhone X/11 Pro/mini', '414x896@2': 'iPhone XR/11', '414x896@3': 'iPhone 11 Pro Max',
  '390x844@3': 'iPhone 12~14', '428x926@3': 'iPhone 12~14 大屏', '393x852@3': 'iPhone 14 Pro~16',
  '430x932@3': 'iPhone 15/16 Plus·Max', '402x874@3': 'iPhone 16 Pro/17', '440x956@3': 'iPhone 16/17 Pro Max',
  '420x912@3': 'iPhone Air',
};
function iphoneModel() {
  const w = Math.min(screen.width, screen.height), h = Math.max(screen.width, screen.height);
  return IPHONE_BY_SCREEN[w + 'x' + h + '@' + Math.round(window.devicePixelRatio || 1)] || 'iPhone';
}
// 国内厂商型号编码 → 补品牌（看到「V2148A」认不出是 vivo）
function brandModel(model) {
  const m = String(model || '').replace(/_/g, ' ').trim();
  if (!m || m === 'K' || /^(wv|Linux|Android)/i.test(m)) return '';
  if (/^(HUAWEI|HONOR|Xiaomi|Redmi|POCO|OPPO|vivo|iQOO|OnePlus|realme|Meizu|MEIZU|Samsung|SM-|Pixel|nubia|ZTE|Lenovo|motorola|moto)/i.test(m)) {
    return m.replace(/^SM-/i, '三星 SM-');
  }
  if (/^V\d{4}[A-Z]{0,2}$/i.test(m)) return 'vivo ' + m;
  if (/^(P[A-Z]{2}\d{3}|PJ[A-Z]\d{3}|CPH\d{4})$/i.test(m)) return 'OPPO ' + m;
  if (/^(RMX\d{4})$/i.test(m)) return 'realme ' + m;
  if (/^\d{4,5}[A-Z0-9]{2,6}$/.test(m) || /^M\d{4}[A-Z]\d+[A-Z]*$/.test(m)) return '小米 ' + m;
  if (/^[A-Z]{3}-[A-Z]{1,2}\d{2}[A-Z]?$/.test(m)) return '华为/荣耀 ' + m;
  if (/^(PG|PE|PK)[A-Z]\d{3}$/i.test(m)) return 'OnePlus ' + m;
  return m;
}
function deviceDesc() {
  const ua = navigator.userAgent;
  if (/iPhone/.test(ua)) return iphoneModel();
  if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return 'iPad'; // iPadOS 伪装成 Mac
  let m = ua.match(/Android[^;)]*;\s*([^;)]+?)\s+Build\//);
  let b = m && brandModel(m[1]);
  if (b) return b;
  m = ua.match(/Android[^;)]*;\s*([^;)]+?)\s*\)/);
  b = m && brandModel(m[1]);
  if (b) return b;
  if (/HarmonyOS|OpenHarmony/i.test(ua)) return '华为鸿蒙手机';
  if (/Android/.test(ua)) return 'Android 手机';
  if (/Macintosh/.test(ua)) return 'Mac 电脑';
  if (/Windows/.test(ua)) return 'Windows 电脑';
  return '未知设备';
}
// 安卓 Chrome/Edge 新版：UA 里型号被精简，Client Hints 能拿到真实型号（异步，页面一打开就取，点加入时早已就绪）
let devDesc = deviceDesc();
if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues && /Android/.test(navigator.userAgent)) {
  navigator.userAgentData.getHighEntropyValues(['model']).then((v) => {
    const b = brandModel(v && v.model);
    if (b) devDesc = b;
  }).catch(() => {});
}
// 设备 ID：同一台手机无论点哪个链接都认得出（存在手机本地）
function deviceId() {
  let d = localStorage.getItem('ssl_did');
  if (!d) { d = Math.random().toString(36).slice(2, 12); localStorage.setItem('ssl_did', d); }
  return d;
}
// 预填上次用过的称呼
const savedName = localStorage.getItem('ssl_dname');
if (savedName) $('nameInput').value = savedName;

function onMsg(m) {
  switch (m.t) {
    case 'view-ok':
      if (m.ice && m.ice.length) iceServers = m.ice;
      setStatus('等待主播…');
      break;
    case 'signal': handleSignal(m.data); break;
    case 'host-offline': setStatus('主播暂时掉线，等待恢复…'); break;
    case 'chat': {
      const who = m.from === 'host' ? '主播' : (m.name || '观众 ' + m.from.slice(0, 4));
      addChat(who, m.text, false, m.file || null);
      if (m.file) showFilePopup(m.file);
      if (!$('chatOverlay').classList.contains('open')) {
        unread++;
        $('chatBtn').classList.add('unread');
        $('chatBtn').querySelector('span:last-child').textContent = '聊天(' + unread + ')';
      }
      break;
    }
    case 'bye':
      intentionalClose = true;
      cleanup();
      $('joinScreen').style.display = 'flex';
      if (m.reason === 'kicked') { showKicked(+m.rest || KICK_REST_SEC); break; }
      $('joinScreen').innerHTML = '<h2>直播已结束</h2><p>对方已挂断，链接已失效。</p>';
      setTop('off', '直播已结束');
      setTitle('V:ended');
      break;
    case 'err':
      setStatus('错误：' + m.msg);
      if (m.msg === 'no-room') {
        $('joinScreen').style.display = 'flex';
        $('joinScreen').innerHTML = '<h2>直播不在线</h2><p>对方还没开播，或链接已失效。</p>';
        setTitle('V:noroom');
      } else if (m.msg === 'resting') {
        intentionalClose = true;
        $('joinScreen').style.display = 'flex';
        showKicked(+m.left || KICK_REST_SEC);
      } else if (m.msg === 'room-full') {
        $('joinScreen').style.display = 'flex';
        $('joinScreen').innerHTML = '<h2>观众已满</h2><p>当前观看人数已达上限，请稍后再试。</p>';
        setTitle('V:full');
      }
      break;
  }
}

// 创建/复用观众端 PC（线路优化时会重协商，必须复用而不是重建）
function ensureViewerPC() {
  if (pc && pc.signalingState !== 'closed') return pc;
  pc = new RTCPeerConnection({
    iceServers,
    ...(RELAY ? { iceTransportPolicy: 'relay' } : {}),
  });
  pc.ontrack = (e) => {
    if (e.track.kind === 'video') {
      // 顺序法识别：协商顺序固定，第一条 video 是屏幕，第二条是主播摄像头
      if (!screenSet) {
        screenSet = true;
        screenRecvTrack = e.track;
        video.srcObject = new MediaStream([e.track]);
        // iOS/微信内核已知坑：轨从静默变活（线路打通）时不自动出帧，必须补 play
        e.track.addEventListener('unmute', () => video.play().catch(() => {}));
        video.play().catch((err) => console.warn('视频自动播放被拦：', err.name, err.message));
      } else {
        const p = document.getElementById('pipHost');
        p.srcObject = new MediaStream([e.track]);
        p.style.display = hostCamOn ? 'block' : 'none';
        e.track.addEventListener('unmute', () => p.play().catch(() => {}));
        p.play().catch((err) => console.warn('画中画自动播放被拦：', err.name, err.message));
      }
      wakeUI();
    } else {
      // 主播可能有多条音轨（麦克风+系统声音）：每条轨独立 <audio> 元素播放
      // （不能共用一个元素后者覆盖前者；也不能聚合进单元素——iOS WebKit 只渲染第一条轨）
      let a = document.getElementById('hostAudio-' + e.track.id);
      if (!a) {
        a = document.createElement('audio');
        a.id = 'hostAudio-' + e.track.id;
        a.autoplay = true;
        a.srcObject = new MediaStream([e.track]);
        document.body.appendChild(a);
      }
      a.play().catch((err) => console.warn('主播声音自动播放被拦：', err.name, err.message));
    }
  };
  pc.onicecandidate = (e) => {
    if (e.candidate && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ t: 'signal', data: { candidate: e.candidate.toJSON() } }));
    }
  };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') {
      keepAwake();
      failedRestarts = 0;
      connectedAt = Date.now();
      setTop('on', mutedByHost ? '已连接 · 主播已将你静音' : '已连接 · 双向通话中');
      setTitle('V:connected');
      wakeUI();
      sendMicState(); // 接通即报一次当前麦克风状态
      // 线路重建后主动「推」一下音视频，避免流恢复但播放器没跟上的静音
      document.querySelectorAll('audio[id^="hostAudio"]').forEach((a) => a.play().catch(() => {}));
      video.play().catch(() => {});
    } else if (pc.connectionState === 'checking') {
      setStatus('正在接通线路…');
    } else if (pc.connectionState === 'disconnected') {
      setStatus('线路波动，正在恢复…');
    } else {
      setStatus('线路：' + pc.connectionState);
    }
    if (pc.connectionState === 'failed') autoRecover();
  };
  return pc;
}

// ---------- 断线分层自救：ICE restart 两次 → 不行走信令整体重连 ----------
let failedRestarts = 0;
function autoRecover() {
  if (intentionalClose) return;
  if (failedRestarts < 2) {
    failedRestarts++;
    setTop('wait', '线路中断，自动恢复中…');
    setStatus('自动恢复中…');
    setTimeout(() => requestRestart('线路中断，正在自动恢复…'), 800);
  } else if (ws && ws.readyState === WebSocket.OPEN) {
    // ICE restart 救不回来（网络已大变）：断开信令，走整体重连重建会话
    try { ws.close(); } catch (_) {}
    ws = null;
  }
  // ws 也不通时 onclose 已进入重连循环；两分钟彻底失败才显示手动重试
}

// 请求主播重启线路：网络切换后中继可升级为直连
let lastBoostTs = 0;
function requestRestart(why) {
  if (!pc || !ws || ws.readyState !== WebSocket.OPEN) return;
  try {
    ws.send(JSON.stringify({ t: 'signal', data: { control: 'restart' } }));
    lastBoostTs = Date.now();
    showToast(why || '正在优化线路…');
  } catch (_) {}
}
// iPhone 拿不到网络切换事件（connection API 不支持），用两组替代信号：
// ① 系统网络恢复事件  ② 回到页面（切完网必然回来看画面）——距上次优化超 60 秒就自动重打洞
window.addEventListener('online', () => {
  if (pc && pc.connectionState === 'connected') requestRestart('网络已恢复，正在优化线路…');
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && pc && pc.connectionState === 'connected') {
    if (lastKnownVia === '中继' && Date.now() - lastBoostTs > 60000) {
      requestRestart('回到页面，正在优化线路…');
    }
  }
});

// 麦克风轨道自愈：死轨重新采集（后台异步，绝不阻塞画面协商）
async function ensureMic() {
  if (micTrack && micTrack.readyState === 'live') return micTrack;
  micTrack = null;
  if (FAKE || !navigator.mediaDevices) return null;
  try {
    setStatus('恢复麦克风…');
    const mic = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    micTrack = mic.getAudioTracks()[0];
    micTrack.enabled = !(selfMuted || mutedByHost);
    setTimeout(() => {
      if (pc && pc.connectionState === 'connected') {
        setTop('on', mutedByHost ? '已连接 · 主播已将你静音' : `已连接 · 麦克风${selfMuted ? '已闭麦' : '已开启'}`);
      }
    }, 1200);
    return micTrack;
  } catch (_) {
    return null;
  }
}

function addRemoteCandidate(cand) {
  if (pc && pc.remoteDescription) pc.addIceCandidate(cand).catch(() => {});
  else pendingCandidates.push(cand);
}
async function flushCandidates() {
  if (!pc || !pc.remoteDescription || !pendingCandidates.length) return;
  const list = pendingCandidates;
  pendingCandidates = [];
  for (const c of list) { try { await pc.addIceCandidate(c); } catch (_) {} }
}
function handleSignal(data) {
  if (data.sdp && data.sdp.type === 'offer') {
    offerChain = offerChain.then(() => processOffer(data.sdp)).catch((err) => console.error('offer 处理失败', err));
  } else if (data.candidate) {
    addRemoteCandidate(data.candidate);
  } else if (data.control === 'restart') {
    // 主播重启了线路（重协商 offer 会走上面 offer 分支）
  } else if (data.control === 'host-cam') {
    // 主播开了/关了摄像头：PIP 显隐（track 内容由 replaceTrack 自动更替）
    hostCamOn = !!data.on;
    const p = document.getElementById('pipHost');
    if (p && p.srcObject) p.style.display = hostCamOn ? 'block' : 'none';
  } else if (data.control === 'party') {
    onPartyState(data);
  } else if (data.control === 'mic-muted') {
    // 主播端静音/恢复我的麦克风
    mutedByHost = !!data.on;
    if (micTrack) micTrack.enabled = !mutedByHost;
    selfMuted = mutedByHost;
    $('muteBtn').classList.toggle('muted', selfMuted);
    const muteIcoH = $('muteBtn').querySelector('.ico'); muteIcoH.innerHTML = '<i data-lucide="' + (selfMuted ? 'mic-off' : 'mic') + '"></i>'; if (window.lucide) window.lucide.createIcons({ attrs: { 'stroke-width': 1.75 } });
    if (pc && pc.connectionState === 'connected') {
      setTop('on', mutedByHost ? '已连接 · 主播已将你静音' : '已连接 · 麦克风已开启');
    }
    showToast(mutedByHost ? '主播已将你静音' : '主播恢复了你的麦克风');
    setTimeout(sendMicState, 100); // 把恢复后的真实状态报回去
  }
}

async function processOffer(sdp) {
  const target = ensureViewerPC();
  await target.setRemoteDescription(sdp);
  await flushCandidates();
  // 轨道活着 → 同步挂上（answer 必须带上音轨）；轨道死了 → 先发 answer 保画面，后台恢复后再补挂
    if (micTrack && micTrack.readyState !== 'live') micTrack = null;
    if (!micTrack && !FAKE && navigator.mediaDevices) {
      ensureMic().then((track) => {
        if (!track) return;
        const audioSender = target.getSenders().find((s) => !s.track || s.track.kind === 'audio');
        if (audioSender) {
          audioSender.replaceTrack(track).catch(() => { try { target.addTrack(track, new MediaStream([track])); } catch (_) {} });
        } else {
          target.addTrack(track, new MediaStream([track]));
        }
        sendMicState();
      }).catch(() => {});
    } else if (micTrack) {
      if (!target.getSenders().some((s) => s.track)) {
        target.addTrack(micTrack, new MediaStream([micTrack]));
      } else {
        const audioSender = target.getSenders().find((s) => s.track && s.track.kind === 'audio');
        if (audioSender && audioSender.track !== micTrack) {
          try { await audioSender.replaceTrack(micTrack); } catch (_) {}
        }
      }
    }
    // 摄像头：开着就挂上（answer 自动配对主播预置的 recvonly video m-line，升为 sendonly）
    if (camOn && camTrack && camTrack.readyState === 'live') {
      const cs = target.getSenders().find((s) => s.__isCam);
      if (!cs) {
        target.addTrack(camTrack, camStream);
        camSender = target.getSenders().find((s) => s.track === camTrack) || null;
        if (camSender) { camSender.__isCam = true; setCamParams(camSender); }
      } else {
        if (cs.track !== camTrack) await cs.replaceTrack(camTrack).catch(() => {});
        camSender = cs;
      }
    } else if (camSender && !camOn) {
      await camSender.replaceTrack(null).catch(() => {});
    }
  const answer = await target.createAnswer();
  await target.setLocalDescription(answer);
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ t: 'signal', data: { sdp: target.localDescription } }));
  }
}

// 只重置媒体链路（自动重连用：保留麦克风轨道，不重新要权限）
function resetPC() {
  if (pc) pc.close();
  pc = null;
  camSender = null;
  pendingCandidates = [];
  offerChain = Promise.resolve();
  screenSet = false;
  screenRecvTrack = null;
  connectedAt = 0;
  firstFrameRestarted = false;
  video.srcObject = null;
  document.querySelectorAll('audio[id^="hostAudio"]').forEach((a) => a.remove());
  const p = document.getElementById('pipHost');
  if (p) { p.srcObject = null; p.style.display = 'none'; }
}
function cleanup() {
  resetPC();
  if (micTrack) { micTrack.stop(); micTrack = null; }
  if (camStream) camStream.getTracks().forEach((t) => t.stop());
  camStream = camTrack = null;
  camOn = false; camSender = null; screenSet = false;
  const box = document.getElementById('selfCamBox');
  if (box) { box.style.display = 'none'; $('pipSelf').srcObject = null; }
  const cb = document.getElementById('camBtn');
  if (cb) cb.classList.remove('active');
  $('talkers').classList.remove('show');
  partyKnown = null;
  partyPeople = null;
  resetZoom();
  releaseWake();
}

// 线路诊断：连接失败时把自己的候选类型逐条亮出来，一眼看出中继有没有参与
async function showDiag() {
  if (!pc) return;
  const lines = [];
  try {
    const stats = await pc.getStats();
    stats.forEach((s) => {
      if (s.type === 'local-candidate') {
        lines.push(`${s.candidateType} · ${s.protocol || 'udp'} · ${s.address || s.ip || '?'}`);
      }
    });
  } catch (_) {}
  const body = lines.length ? lines.join('<br>') : '没有任何候选线路（ICE 配置未生效）';

// ---------- 摄像头：手动开，480p 低带宽推给主播；前后摄可翻转 ----------
async function startCam() {
  if (camOn) return;
  // 微信内置浏览器（尤其 iOS）常完全没有 getUserMedia：给出明确指引而不是笼统的「开启失败」
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showToast('当前环境开不了摄像头：请点右上角菜单「在浏览器中打开」');
    setTitle('V:err:cam-noapi');
    return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: camFacing, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 15, max: 15 } },
      audio: false,
    });
    camTrack = camStream.getVideoTracks()[0];
    camTrack.contentHint = 'motion';
    camOn = true;
    $('camBtn').classList.add('active');
    $('selfCamBox').style.display = 'block';
    $('pipSelf').srcObject = camStream;
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ t: 'signal', data: { control: 'cam', on: true } }));
    }
  } catch (err) {
    console.error(err);
    showToast(err.name === 'NotAllowedError' ? '没有摄像头权限，请在微信设置里允许后重试' : '摄像头开启失败');

// ---------- 画面放大：手机看电脑屏字太小 → 双指缩放、双击放大/还原、放大后单指拖动；电脑上滚轮缩放 ----------
const zoom = { s: 1, x: 0, y: 0 };
let lastDoubleTap = 0;
let zoomTipShown = false;
function zoomBox() {
  const r = video.parentElement.getBoundingClientRect();
  return { left: r.left + video.offsetLeft, top: r.top + video.offsetTop, w: video.offsetWidth, h: video.offsetHeight };
}
function applyZoom() {
  const b = zoomBox();
  zoom.s = Math.min(5, Math.max(1, zoom.s));
  if (zoom.s < 1.02) { zoom.s = 1; zoom.x = zoom.y = 0; }
  zoom.x = Math.min(0, Math.max(b.w - b.w * zoom.s, zoom.x)); // 不让画面拖出边界
  zoom.y = Math.min(0, Math.max(b.h - b.h * zoom.s, zoom.y));
  video.style.transformOrigin = '0 0';
  video.style.transform = zoom.s === 1 ? '' : 'translate(' + zoom.x + 'px,' + zoom.y + 'px) scale(' + zoom.s + ')';
  const badge = $('zoomBadge');
  badge.textContent = '🔍 ' + zoom.s.toFixed(1) + '×  点这里还原';
  badge.classList.toggle('show', zoom.s > 1);
}
function zoomAt(cx, cy, ns) { // 以屏幕上 (cx, cy) 这一点为中心缩放
  const b = zoomBox();
  const px = cx - b.left, py = cy - b.top;
  ns = Math.min(5, Math.max(1, ns));
  const k = ns / zoom.s;
  zoom.x = px - (px - zoom.x) * k;
  zoom.y = py - (py - zoom.y) * k;
  zoom.s = ns;
  applyZoom();
}
function resetZoom() { zoom.s = 1; zoom.x = zoom.y = 0; applyZoom(); }
$('zoomBadge').onclick = resetZoom;
window.addEventListener('resize', resetZoom);
let pinch = null, pan = null, lastTap = { t: 0, x: 0, y: 0 };
const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
video.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const [a, b] = e.touches;
    pinch = { d: dist(a, b), s: zoom.s, mx: (a.clientX + b.clientX) / 2, my: (a.clientY + b.clientY) / 2 };
    pan = null;
  } else if (e.touches.length === 1 && zoom.s > 1) {
    pan = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
}, { passive: true });
video.addEventListener('touchmove', (e) => {
  if (pinch && e.touches.length === 2) {
    e.preventDefault();
    const [a, b] = e.touches;
    const mx = (a.clientX + b.clientX) / 2, my = (a.clientY + b.clientY) / 2;
    zoom.x += mx - pinch.mx; zoom.y += my - pinch.my; // 双指一起移动 = 平移
    pinch.mx = mx; pinch.my = my;
    zoomAt(mx, my, pinch.s * dist(a, b) / pinch.d);
  } else if (pan && e.touches.length === 1) {
    e.preventDefault();
    const t = e.touches[0];
    zoom.x += t.clientX - pan.x; zoom.y += t.clientY - pan.y;
    pan = { x: t.clientX, y: t.clientY };
    applyZoom();
  }
}, { passive: false });
video.addEventListener('touchend', (e) => {
  if (e.touches.length < 2) pinch = null;
  if (e.touches.length === 0) pan = null;
  if (e.changedTouches.length !== 1 || e.touches.length) return;
  const t = e.changedTouches[0], now = Date.now();
  if (now - lastTap.t < 300 && Math.hypot(t.clientX - lastTap.x, t.clientY - lastTap.y) < 40) {
    lastDoubleTap = now;
    lastTap.t = 0;
    if (zoom.s > 1) resetZoom(); else zoomAt(t.clientX, t.clientY, 2.5);
    return;
  }
  lastTap = { t: now, x: t.clientX, y: t.clientY };
}, { passive: true });
video.addEventListener('dblclick', (e) => { // 电脑浏览器双击
  lastDoubleTap = Date.now();
  if (zoom.s > 1) resetZoom(); else zoomAt(e.clientX, e.clientY, 2.5);
});
video.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, zoom.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15));
}, { passive: false });
let dragM = null;
video.addEventListener('mousedown', (e) => { if (zoom.s > 1) dragM = { x: e.clientX, y: e.clientY }; });
window.addEventListener('mousemove', (e) => {
  if (!dragM || !(e.buttons & 1)) { dragM = null; return; }
  zoom.x += e.clientX - dragM.x; zoom.y += e.clientY - dragM.y;
  dragM = { x: e.clientX, y: e.clientY };
  applyZoom();
});

let lastBytes = 0, grow = 0, lastMetaTs = 0, lastQosTs = 0;
let lastPktsLost = 0, lastPktsRecv = 0, lastFrames = 0, lastFramesTs = 0;
let resH = 0; // 收到的画面高度（服务器实际发来的分辨率）
let lastKnownVia = ''; // 最近一次统计的线路类型（回页面时的自动优化依据）
let rttBaseline = null; // RTT 长期基线（网络漫游检测：突变=环境变了）
let rttShiftCount = 0, netShiftAt = 0;
// HTTP 主动探测：切网后旧媒体流还走老接口，统计上「一切没变」；
// 新发起的请求会被 iOS 强制走当前最优网络（WiFi），探测延迟突变即可暴露切网
let httpBase = null, httpShift = 0, lastHttpProbe = 0;
async function probeNet() {
  const now = Date.now();
  if (now - lastHttpProbe < 12000 || !ws || ws.readyState !== WebSocket.OPEN) return;
  if (!pc || pc.connectionState !== 'connected' || lastKnownVia !== '中继') { httpBase = null; return; }
  lastHttpProbe = now;
  const t0 = performance.now();
  try {
    await fetch(location.origin + '/host.html', { method: 'HEAD', cache: 'no-store' });
  } catch (_) { return; }
  const r = Math.round(performance.now() - t0);
  if (httpBase == null) { httpBase = r; return; }
  httpBase = httpBase * 0.8 + r * 0.2;
  // 只对「显著变快」敏感：蜂窝→WiFi 的特征（变慢多半是拥塞噪声，不值得打断）
  if (r < httpBase && (httpBase - r) / Math.max(httpBase, 1) > 0.3) {
    httpShift++;
    if (httpShift >= 2) {
      httpShift = 0;
      httpBase = r;
      if (now - lastBoostTs > 60000) requestRestart('检测到更快的网络，升级直连…');
    }
  } else {
    httpShift = 0;
  }
}
setInterval(probeNet, 6000);
// 网络质量分级：绿=正常 黄=注意 红=差
const grade = (v, warn, bad) => v >= bad ? 'bad' : v >= warn ? 'warn' : 'good';
const rttCls = (ms) => ms == null ? '' : grade(ms, 150, 400);
const lossCls = (r) => grade(r, 0.02, 0.08);
const kbpsCls = (k) => (k >= 500 ? 'good' : k >= 100 ? 'warn' : 'bad');
setInterval(async () => {
  if (!pc) return;
  try {
    const stats = await pc.getStats();
    let bytes = 0, rtt = null, via = '';
    let lost = 0, recv = 0, fps = 0, frames = 0;
    stats.forEach((s) => {
      if (s.type === 'inbound-rtp' && s.kind === 'video') {
        bytes += s.bytesReceived;
        lost += s.packetsLost || 0;
        recv += s.packetsReceived || 0;
        frames += s.framesDecoded || 0;
        if (s.framesPerSecond) fps += s.framesPerSecond;
        if (s.frameHeight) resH = s.frameHeight;
      }
      if (s.type === 'candidate-pair' && s.state === 'succeeded' && s.nominated && s.currentRoundTripTime != null) {
        rtt = Math.round(s.currentRoundTripTime * 1000);
        // 链路任一端是中继，全链路就是中继
        const local = stats.get(s.localCandidateId);
        const remote = stats.get(s.remoteCandidateId);
        const types = [local && local.candidateType, remote && remote.candidateType];
        if (types.some(Boolean)) via = types.includes('relay') ? '中继' : '直连';
      }
    });
    if (!fps && frames && lastFrames && lastFramesTs) {
      const dt = (Date.now() - lastFramesTs) / 1000;
      if (dt > 0) fps = Math.round((frames - lastFrames) / dt);
    }
    lastFrames = frames;
    lastFramesTs = Date.now();
    grow = bytes > lastBytes ? grow + 1 : 0;
    const now = Date.now();
    let kbps = 0, lossRate = 0;
    if (lastMetaTs && now > lastMetaTs) {
      kbps = Math.max(0, Math.round((bytes - lastBytes) * 8 / (now - lastMetaTs)));
      // 窗口内丢包率（比累计值灵敏，也不受静态画面低码率干扰）
      const dLost = Math.max(0, lost - lastPktsLost), dRecv = Math.max(0, recv - lastPktsRecv);
      lossRate = (dLost + dRecv) > 0 ? dLost / (dLost + dRecv) : 0;
      if (via) {
        lastKnownVia = via;
        const fpsCls = (f) => (f >= 22 ? 'good' : f >= 12 ? 'warn' : 'bad');
        const fpsTxt = fps > 0 ? `<span class="${fpsCls(fps)}">${fps}帧</span> · ` : '';
        const res = resH >= 1000 ? '1080p' : resH >= 680 ? '720p' : resH >= 460 ? '540p' : resH >= 300 ? '360p' : (resH ? resH + 'p' : '');
        const resTxt = res ? `<b style="color:#e8e8ee">${res}</b>·` : '';
        $('topMeta').innerHTML = `${via}·${resTxt}<span class="${kbpsCls(kbps)}">${(kbps / 8 / 1000).toFixed(1)}M</span>·${fpsTxt.replace(' · ', '·')}<span class="${rttCls(rtt)}">${rtt ?? '-'}ms</span>` +
          (lossRate > 0.02 ? `·<span class="${lossCls(lossRate)}">丢包${Math.round(lossRate * 100)}%</span>` : '');
      }
      // 中继 + 体验差持续 30 秒 → 自动请求重启线路升级直连（最多两次；回直连后预算重置）
      const poor = via === '中继' && ((fps > 0 && fps < 18) || (rtt != null && rtt > 300));
      if (poor) {
        if (!poorSince) poorSince = now;
        else if (now - poorSince > 30000 && autoBoostCount < 2) {
          requestRestart('当前线路不理想，尝试优化…');
          autoBoostCount++;
          poorSince = now;
        }
      } else {
        poorSince = 0;
        if (via === '直连' && autoBoostCount) autoBoostCount = 0;
      }
      // 系统自动漫游检测（iOS 无网络事件）：RTT 相对基线突变且连续 3 次 → 网络环境变了
      // 注意：只先「记录」，给 ICE 自愈（自动 failover，1~2 秒）留时间；
      // 12 秒后仍在中继才主动重打洞升级——立刻重打洞会叠加二次中断，拉长无声期
      if (rtt != null && pc.connectionState === 'connected') {
        if (rttBaseline == null) {
          rttBaseline = rtt;
        } else {
          rttBaseline = rttBaseline * 0.95 + rtt * 0.05; // 基线缓慢跟随
          const shift = Math.abs(rtt - rttBaseline) / Math.max(rttBaseline, 1);
          if (shift > 0.4) {
            rttShiftCount++;
            if (rttShiftCount >= 3) {
              rttBaseline = rtt;
              rttShiftCount = 0;
              netShiftAt = now;
            }
          } else {
            rttShiftCount = 0;
          }
        }
      }
      if (netShiftAt && now - netShiftAt > 12000) {
        if (lastKnownVia === '中继' && now - lastBoostTs > 90000) {
          requestRestart('网络已变化，切换到更优线路…');
        }
        netShiftAt = 0;
      }
      // 向主播上报网络质量（自动画质档位的依据）
      if (now - lastQosTs > 2000 && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ t: 'qos', fps, kbps, loss: lossRate, rtt: rtt || 0 }));
        lastQosTs = now;
      }
      lastPktsLost = lost;
      lastPktsRecv = recv;
    }
    lastBytes = bytes;
    lastMetaTs = now;
    if (video.videoWidth > 0 && grow >= 2) {
      setTitle('V:playing');
      $('tapHint').style.display = 'none';
      // 第一次在手机上看：提示一下可以放大（每台设备只提示一次）
      try {
        if (!zoomTipShown && navigator.maxTouchPoints > 0 && !localStorage.getItem('ssl_zoomtip')) {
          zoomTipShown = true;
          localStorage.setItem('ssl_zoomtip', '1');
          setTimeout(() => showToast('字太小？双指张开或双击画面可以放大 🔍'), 2500);
        }
      } catch (_) {}
    }
    // 黑屏兜底：线路通了但视频被拦着没播（蜂窝省流模式常见）→ 给出点按提示
    if (pc.connectionState === 'connected' && bytes > 0 && (video.paused || video.readyState < 2)) {
      $('tapHint').style.display = 'flex';
    }
  } catch (_) {}
}, 1000);

if (AUTOSTART && room) {
  join();
  if (FAKE) {
    // e2e：接通后自动开摄像头（Chrome fake 设备画面），验证观众→主播视频回传链路
    const camTimer = setInterval(() => {
      if (pc && pc.connectionState === 'connected') {
        clearInterval(camTimer);
        setTimeout(() => { if (!camOn) startCam(); }, 800);
      }
    }, 500);
  }
}

// ==================== 2026-09-27 新增：顶部挂断 + 表情回应 ====================
const topHangEl = document.getElementById('topHang');
if (topHangEl) topHangEl.onclick = () => { const hb = document.getElementById('hangBtn'); if (hb) hb.click(); };
// ==================== 表情回应 ====================
const reactBtnEl = document.getElementById('reactBtn');
if (reactBtnEl) reactBtnEl.onclick = () => {
  document.getElementById('reactPanel').classList.toggle('open');
};
document.querySelectorAll('#reactPanel button').forEach((b) => {
  b.addEventListener('click', () => {
    const emo = b.dataset.emoji;
    if (ws && ws.readyState === WebSocket.OPEN) {
      try { ws.send(JSON.stringify({ t: 'signal', data: { control: 'react', emoji: emo } })); showToast('已发送 ' + emo); }
      catch (_) { showToast('发送失败'); }
    } else {
      showToast('还没有进入直播');
    }
    document.getElementById('reactPanel').classList.remove('open');
  });
});
document.addEventListener('click', (e) => {
  const p = document.getElementById('reactPanel');
  if (p && p.classList.contains('open') && !p.contains(e.target) && !(e.target.closest && e.target.closest('#reactBtn'))) p.classList.remove('open');
});
(function refreshIconsV() {
  const run = () => { if (window.lucide) window.lucide.createIcons({ attrs: { 'stroke-width': 1.75 } }); };
  if (window.lucide) run(); else window.addEventListener('load', run);
})();
</script>
</body>
